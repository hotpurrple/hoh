name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and bake in Vosk model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o /tmp/vosk-model.zip \
            https://alphacephei.com/kaldi/models/vosk-model-small-en-us-0.15.zip
          # Unzip into assets/vosk-model/ — the app will extract this on first launch
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model-extracted
          # The zip contains a single top-level folder; move its contents under a stable name
          INNER=$(ls /tmp/vosk-model-extracted/)
          mv /tmp/vosk-model-extracted/$INNER app/src/main/assets/vosk-model
          echo "Baked model size: $(du -sh app/src/main/assets/vosk-model | cut -f1)"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOReaderVoicePager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
